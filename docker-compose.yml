services:
  cloud-deployer-test-simulator:
    platform: ${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
    build: .
    image: cloud-deployer-test-simulator:local
    environment:
      SIMULATOR_MOCK_AWS: "${SIMULATOR_MOCK_AWS:-true}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      AWS_REGION: "${AWS_REGION:-eu-central-1}"
    volumes:
      - type: bind
        source: ${SIMULATOR_INPUT_HOST_DIR:-./input}/config.json
        target: /app/config.json
        read_only: true
      - type: bind
        source: ${SIMULATOR_INPUT_HOST_DIR:-./input}/config_hierarchy.json
        target: /app/config_hierarchy.json
        read_only: true
      - type: bind
        source: ${SIMULATOR_INPUT_HOST_DIR:-./input}/config_iot_devices.json
        target: /app/config_iot_devices.json
        read_only: true
    ports:
      - "127.0.0.1:${SIMULATOR_HOST_PORT:-5000}:5000"
